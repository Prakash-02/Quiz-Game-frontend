server:
  port: ${PORT:8080}

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/quizgame}
    username: ${SPRING_DATASOURCE_USERNAME:quizgame}
    password: ${SPRING_DATASOURCE_PASSWORD:quizgame}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  servlet:
    multipart:
      enabled: true
      max-file-size: 20MB
      max-request-size: 25MB

cloudinary:
  url: ${CLOUDINARY_URL:}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  scoring:
    base-points: 1000
    speed-multiplier: 0.5
